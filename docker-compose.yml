name: grupo05-academia

services:
  db:
    image: mysql:8.4
    container_name: academia-mysql
    hostname: academia-mysql
    restart: unless-stopped
    environment:
      TZ: America/Fortaleza
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:?defina WORDPRESS_DB_PASSWORD}
      ACADEMIA_DB_PASSWORD: ${ACADEMIA_DB_PASSWORD:?defina ACADEMIA_DB_PASSWORD}
      DEMO_DB_PASSWORD: ${DEMO_DB_PASSWORD:?defina DEMO_DB_PASSWORD}
    ports:
      - "${LAB_BIND_IP:-192.168.15.10}:3305:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/00-academia.sql:/docker-entrypoint-initdb.d/00-academia.sql:ro
      - ./mysql/10-permissoes.sh:/docker-entrypoint-initdb.d/10-permissoes.sh:ro
    networks:
      academia-net:
        ipv4_address: 172.25.0.3
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u wordpress --database=wordpress --execute="SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  wordpress:
    image: wordpress:php8.3-apache
    container_name: academia-wordpress
    hostname: academia-wordpress
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: America/Fortaleza
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?defina WORDPRESS_DB_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://blog.academia.local:9005');
        define('WP_SITEURL', 'http://blog.academia.local:9005');
        define('DISALLOW_FILE_EDIT', true);
    ports:
      - "${LAB_BIND_IP:-192.168.15.10}:9005:80"
    volumes:
      - wordpress_data:/var/www/html
      - ./wordpress/grupo05-academia.php:/var/www/html/wp-content/mu-plugins/grupo05-academia.php:ro
    networks:
      academia-net:
        ipv4_address: 172.25.0.2

  app:
    build: ./app
    container_name: academia-app
    hostname: academia-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: America/Fortaleza
      ACADEMIA_DB_HOST: db
      ACADEMIA_DB_NAME: academia
      ACADEMIA_DB_USER: academia_app
      ACADEMIA_DB_PASSWORD: ${ACADEMIA_DB_PASSWORD:?defina ACADEMIA_DB_PASSWORD}
    ports:
      - "${LAB_BIND_IP:-192.168.15.10}:8005:80"
    networks:
      academia-net:
        ipv4_address: 172.25.0.4

networks:
  academia-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/24
          gateway: 172.25.0.1

volumes:
  mysql_data:
  wordpress_data:
